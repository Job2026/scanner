<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code & Cargo | Enterprise Universal ATS Parser</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .app-window {
            width: 100%;
            max-width: 600px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        .app-header {
            border-bottom: 1px solid #30363d;
            padding-bottom: 12px;
            margin-bottom: 18px;
        }

        .title-text-main { font-weight: bold; color: #58a6ff; font-size: 14px; margin-bottom: 4px; }
        .title-text-sub { font-size: 11px; color: #39ff14; font-family: monospace; }

        .input-label { display: block; font-size: 12px; color: #8b949e; font-weight: bold; margin-bottom: 6px; margin-top: 14px;}
        
        input[type="text"], textarea {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #fff;
            padding: 12px;
            font-size: 13px;
            box-sizing: border-box;
        }

        textarea { height: 130px; font-family: monospace; resize: none; }

        .btn-container { display: flex; gap: 10px; margin-top: 15px; margin-bottom: 18px; }
        .btn { flex: 1; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; border: none; }
        .btn-scan { background: #238636; color: #fff; }
        .btn-clear { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }

        /* FIXED INTERFACE BOX - NO SLIPPING BOUNDARIES */
        .console-output {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 16px;
            display: none;
            box-sizing: border-box;
        }

        .console-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .console-tag { font-family: monospace; font-size: 11px; color: #8b949e; }
        
        .badge {
            font-family: monospace;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        .badge-fail { background: rgba(255,51,51,0.15); color: #ff3333; border: 1px solid #ff3333; }
        .badge-pass { background: rgba(57,255,20,0.15); color: #39ff14; border: 1px solid #39ff14; }

        .feedback-box { font-family: monospace; font-size: 12px; line-height: 1.5; white-space: pre-wrap; }

        .pro-trigger-box { display: none; margin-top: 15px; text-align: center; }
        .btn-pro { background: #0056b3; color: white; border-radius: 6px; padding: 14px; width: 100%; font-weight: bold; cursor: pointer; border: none; display: block; box-sizing: border-box; text-decoration: none; font-size: 13px; }
        
        .keyword-badge-container { margin-top: 12px; display: none; background: rgba(88,166,255,0.1); padding: 10px; border-radius: 6px; border: 1px solid #30363d;}
        .keyword-tag { background: #21262d; border: 1px solid #30363d; color: #58a6ff; padding: 3px 6px; border-radius: 4px; font-size: 11px; margin-right: 5px; display: inline-block; margin-top: 4px; font-family: monospace;}
    </style>
</head>
<body>

<div class="app-window">
    <div class="app-header">
        <div class="title-text-main">CODE & CARGO // SYSTEM INTERFACE</div>
        <div class="title-text-sub">>_ UNIVERSAL ATS GEOMETRY PARSER v2.0</div>
    </div>

    <label class="input-label">Target Profession / Job Title (Optional):</label>
    <input type="text" id="jobTitleInput" placeholder="e.g., Software Engineer, Auditor">

    <label class="input-label">Paste Resume Text Stream Directly Below:</label>
    <textarea id="resumeContent" placeholder="Paste your plain text stream here to analyze structural geometry arrays..."></textarea>

    <div class="btn-container">
        <button class="btn btn-scan" onclick="executeUniversalAudit()">RUN AUTOMATED ATS GEOMETRY SCAN</button>
        <button class="btn btn-clear" onclick="clearSystemBuffer()">CLEAR</button>
    </div>

    <!-- Fixed Console Terminal Box -->
    <div class="console-output" id="consoleResult">
        <div class="console-header">
            <span class="console-tag">[ATS_ALGORITHMIC_METRICS]</span>
            <span class="badge" id="statusBadge">PENDING</span>
        </div>
        <div class="feedback-box" id="structuralFeedback"></div>
        
        <!-- Keyword System Section Integrated Properly -->
        <div class="keyword-badge-container" id="keywordDeficitArea">
            <div style="font-size: 11px; color: #ff3333; font-weight: bold; margin-bottom: 4px;">⚠️ DETECTED CORE SKILL KEYWORD DEFICIT:</div>
            <div id="missingKeywordsList"></div>
        </div>
    </div>

    <div class="pro-trigger-box" id="proTrigger">
        <button class="btn-pro" onclick="navigateToProOptimizer()">DOWNLOAD BOT-PROOF RESUME CONFIGURATION</button>
    </div>
</div>

<script>
function executeUniversalAudit() {
    // 1. Establish Secure UI Element Sinks
    const resumeText = document.getElementById("resumeContent")?.value;
    const targetJob = document.getElementById("jobTitleInput")?.value || "";
    
    const consoleResult = document.getElementById("consoleResult");
    const feedbackBox = document.getElementById("structuralFeedback");
    const missingKeywordsList = document.getElementById("missingKeywordsList");
    const keywordDeficitArea = document.getElementById("keywordDeficitArea");
    const metricBadge = document.querySelector(".status-badge") || document.getElementById("malfunctionBadge");

    if (!resumeText || !resumeText.trim()) {
        alert("Input stream empty. Paste your resume text layer.");
        return;
    }

    consoleResult.style.display = "block";

    // 2. REAL LAYOUT LOGIC REASONING (Ignores basic bullet points and list spacing)
    const textLines = resumeText.split(/\r?\n/).filter(line => line.trim().length > 0);
    let matrixTableLines = 0;
    
    textLines.forEach(line => {
        // Only flag line if it contains literal hard-grid boundaries or multiple pipe dividers
        const hasGridDividers = /[║│█─┼╚═╗🗂]/.test(line);
        const pipeDividersCount = (line.match(/\|/g) || []).length;
        
        if (hasGridDividers || pipeDividersCount > 1) {
            matrixTableLines++;
        }
    });

    const trueGridDensity = textLines.length > 0 ? Math.round((matrixTableLines / textLines.length) * 100) : 0;
    const layoutIsCorrupted = trueGridDensity >= 20; // Only fails if real structural tables cross 20% threshold

    // 3. Dynamic Stop-Words Filter & Text Tokenizer
    const cleanResume = resumeText.toLowerCase();
    const stopWords = new Set(["and", "the", "for", "with", "this", "that", "from", "your", "management", "skills"]);
    
    const jobTokens = targetJob.toLowerCase().replace(/[^a-zA-Z0-9\s]/g, " ").split(/\s+/);
    let dynamicKeywords = jobTokens.filter(word => word.length > 2 && !stopWords.has(word));

    if (dynamicKeywords.length === 0) {
        dynamicKeywords = ["execution", "operations", "data", "systems"];
    }

    let missingSkills = [];
    dynamicKeywords.forEach(kw => {
        if (!cleanResume.includes(kw)) missingSkills.push(kw);
    });

    // 4. --- RENDER AUTHENTIC UI VERDICTS (FIXED SYNTAX FRAGMENTS) ---
    if (layoutIsCorrupted) {
        if (metricBadge) { metricBadge.innerText = "MALFUNCTION"; metricBadge.style.background = "#ff3333"; metricBadge.style.color = "#fff"; }
        feedbackBox.innerHTML = `<h3 style="color: #ff3333; margin-top:0;">✕ Layout Table Grid Detected:</h3>
        <p style="color: #c9d1d9; line-height:1.6;">Our parser identified complex tabular data boundaries (${trueGridDensity}% density). Multi-column tables hide text strings from indexing nodes.</p>`;
    } else {
        if (metricBadge) { metricBadge.innerText = "COMPLIANT"; metricBadge.style.background = "#39ff14"; metricBadge.style.color = "#000"; }
        feedbackBox.innerHTML = `<h3 style="color: #39ff14; margin-top:0;">✓ Linear Layout Verified:</h3>
        <p style="color: #c9d1d9; line-height:1.6;">Structure validation success! Your text stream parses down a clean vertical vector sequence. Zero complex side-by-side columns found.</p>
        <div style="margin-top: 15px;">
            <a href="pro-optimizer.html" style="display: inline-block; padding: 10px 20px; background: #ffaa00; color: #000; text-decoration: none; font-weight: bold; border-radius: 4px; font-family: sans-serif;">PROCEED TO PRO-OPTIMIZER HUB FOR EXPORT ➡️</a>
        </div>`;
    }

    // 5. Fixed Keyword Tag Output (Wiped away the broken '开口' text string)
    if (missingSkills.length > 0) {
        keywordDeficitArea.style.display = "block";
        missingKeywordsList.innerHTML = "";
        missingSkills.forEach(skill => {
            missingKeywordsList.innerHTML += `<span class="keyword-tag" style="display:inline-block; margin:3px; padding:4px 8px; background:rgba(248,81,73,0.15); border:1px solid #f85149; color:#f85149; border-radius:4px; font-size:11px; font-family:monospace;">✗ ${skill.toUpperCase()}</span> `;
        });
    } else {
        keywordDeficitArea.style.display = "none";
    }
}

function clearSystemBuffer() {
    document.getElementById("jobTitleInput").value = "";
    document.getElementById("resumeContent").value = "";
    document.getElementById("consoleResult").style.display = "none";
    document.getElementById("proTrigger").style.display = "none";

}

function navigateToProOptimizer() {
    window.location.href = "pro-optimizer.html";
}
</script>

</body>
</html>
