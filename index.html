<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code & Cargo | Enterprise Universal ATS Parser</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .app-window {
            width: 100%;
            max-width: 600px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        .app-header {
            border-bottom: 1px solid #30363d;
            padding-bottom: 12px;
            margin-bottom: 18px;
        }

        .title-text-main { font-weight: bold; color: #58a6ff; font-size: 14px; margin-bottom: 4px; }
        .title-text-sub { font-size: 11px; color: #39ff14; font-family: monospace; }

        .input-label { display: block; font-size: 12px; color: #8b949e; font-weight: bold; margin-bottom: 6px; margin-top: 14px;}
        
        input[type="text"], textarea {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #fff;
            padding: 12px;
            font-size: 13px;
            box-sizing: border-box;
        }

        textarea { height: 130px; font-family: monospace; resize: none; }

        .btn-container { display: flex; gap: 10px; margin-top: 15px; margin-bottom: 18px; }
        .btn { flex: 1; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; border: none; }
        .btn-scan { background: #238636; color: #fff; }
        .btn-clear { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }

        /* FIXED INTERFACE BOX - NO SLIPPING BOUNDARIES */
        .console-output {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 16px;
            display: none;
            box-sizing: border-box;
        }

        .console-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .console-tag { font-family: monospace; font-size: 11px; color: #8b949e; }
        
        .badge {
            font-family: monospace;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        .badge-fail { background: rgba(255,51,51,0.15); color: #ff3333; border: 1px solid #ff3333; }
        .badge-pass { background: rgba(57,255,20,0.15); color: #39ff14; border: 1px solid #39ff14; }

        .feedback-box { font-family: monospace; font-size: 12px; line-height: 1.5; white-space: pre-wrap; }

        .pro-trigger-box { display: none; margin-top: 15px; text-align: center; }
        .btn-pro { background: #0056b3; color: white; border-radius: 6px; padding: 14px; width: 100%; font-weight: bold; cursor: pointer; border: none; display: block; box-sizing: border-box; text-decoration: none; font-size: 13px; }
        
        .keyword-badge-container { margin-top: 12px; display: none; background: rgba(88,166,255,0.1); padding: 10px; border-radius: 6px; border: 1px solid #30363d;}
        .keyword-tag { background: #21262d; border: 1px solid #30363d; color: #58a6ff; padding: 3px 6px; border-radius: 4px; font-size: 11px; margin-right: 5px; display: inline-block; margin-top: 4px; font-family: monospace;}
    </style>
</head>
<body>

<div class="app-window">
    <div class="app-header">
        <div class="title-text-main">CODE & CARGO // SYSTEM INTERFACE</div>
        <div class="title-text-sub">>_ UNIVERSAL ATS GEOMETRY PARSER v2.0</div>
    </div>

    <label class="input-label">Target Profession / Job Title (Optional):</label>
    <input type="text" id="jobTitleInput" placeholder="e.g., Software Engineer, Auditor">

    <label class="input-label">Paste Resume Text Stream Directly Below:</label>
    <textarea id="resumeContent" placeholder="Paste your plain text stream here to analyze structural geometry arrays..."></textarea>

    <div class="btn-container">
        <button class="btn btn-scan" onclick="executeUniversalAudit()">RUN AUTOMATED ATS GEOMETRY SCAN</button>
        <button class="btn btn-clear" onclick="clearSystemBuffer()">CLEAR</button>
    </div>

    <!-- Fixed Console Terminal Box -->
    <div class="console-output" id="consoleResult">
        <div class="console-header">
            <span class="console-tag">[ATS_ALGORITHMIC_METRICS]</span>
            <span class="badge" id="statusBadge">PENDING</span>
        </div>
        <div class="feedback-box" id="structuralFeedback"></div>
        
        <!-- Keyword System Section Integrated Properly -->
        <div class="keyword-badge-container" id="keywordDeficitArea">
            <div style="font-size: 11px; color: #ff3333; font-weight: bold; margin-bottom: 4px;">⚠️ DETECTED CORE SKILL KEYWORD DEFICIT:</div>
            <div id="missingKeywordsList"></div>
        </div>
    </div>

    <div class="pro-trigger-box" id="proTrigger">
        <button class="btn-pro" onclick="navigateToProOptimizer()">DOWNLOAD BOT-PROOF RESUME CONFIGURATION</button>
    </div>
</div>

<script>
function executeUniversalAudit() {
    sessionStorage.setItem("rawResumePaylaod", document.getElementById("resumeContent").value);
    const resumeText = document.getElementById("resumeContent").value.trim();
    const jobTitle = document.getElementById("jobTitleInput").value.toLowerCase();
    
    const consoleBox = document.getElementById("consoleResult");
    const feedback = document.getElementById("structuralFeedback");
    const badge = document.getElementById("statusBadge");
    const proBox = document.getElementById("proTrigger");
    const keywordArea = document.getElementById("keywordDeficitArea");
    const keywordList = document.getElementById("missingKeywordsList");

    if (!resumeText) {
        alert("Input stream empty. Paste your resume text layout.");
        return;
    }

    consoleBox.style.display = "block";
    proBox.style.display = "block";
    keywordArea.style.display = "none";
    keywordList.innerHTML = "";

    // --- TRUE ALGORITHMIC SPACING CHECK ---
    // Counts consecutive spacing fragments that indicate broken hidden table coordinates or multi-column grids
    const columnFragments = (resumeText.match(/ {4,}/g) || []).length;
    const hasTabs = resumeText.includes('\t');

    if (columnFragments > 2 || hasTabs) {
        // LEVEL 1: True Formatting Malfunction Detected
        badge.className = "badge badge-fail";
        badge.innerText = "MALFUNCTION";
        feedback.innerHTML = `<span style="color: #ff3333; font-weight: bold;">✕ Layout Geometry Malfunction Detected:</span>\n\nOur structural metrics identified irregular horizontal spacing blocks inside your text stream. Side-by-side columns or design text frames turn into chaotic overlapping data strings during machine indexing, completely blinding recruiters to your qualifications.`;
    } else {
        // LEVEL 2: True Compliant Linear Structure Detected
        badge.className = "badge badge-pass";
        badge.innerText = "PASSED";
        feedback.innerHTML = `<span style="color: #39ff14; font-weight: bold;">✓ Core Layout Geometry: 100% Compliant</span>\n\nYour structural document path flows in a clean sequential grid. Machine tracking spiders can map your skill arrays into index tables without coordinate drift. Proceed to verify target word density optimizations below.`;
    }

    // --- RETAINED DICTIONARY LOGIC FROM YOUR SYSTEM ---
    let missingSkills = [];
    let isTrackedProfession = false;

    if (jobTitle) {
        const lowerResume = resumeText.toLowerCase();
        
        if (jobTitle.includes("nurse") || jobTitle.includes("medical") || jobTitle.includes("health")) {
            isTrackedProfession = true;
            const skills = ["bls", "acls", "clinical", "charting", "triage"];
            skills.forEach(skill => { if (!lowerResume.includes(skill)) missingSkills.push(skill); });
        }
        else if (jobTitle.includes("account") || jobTitle.includes("finance") || jobTitle.includes("audit")) {
            isTrackedProfession = true;
            const skills = ["ledger", "excel", "reconciliation", "gaap", "forecasting", "invoice"];
            skills.forEach(skill => { if (!lowerResume.includes(skill)) missingSkills.push(skill); });
        }
        else if (jobTitle.includes("project") || jobTitle.includes("manager") || jobTitle.includes("scrum")) {
            isTrackedProfession = true;
            const skills = ["agile", "scrum", "jira", "sprint", "roadmap", "budget", "stakeholder"];
            skills.forEach(skill => { if (!lowerResume.includes(skill)) missingSkills.push(skill); });
        }
        else if (jobTitle.includes("software") || jobTitle.includes("developer") || jobTitle.includes("engineer")) {
            isTrackedProfession = true;
            const skills = ["git", "api", "javascript", "python", "docker", "aws", "database"];
            skills.forEach(skill => { if (!lowerResume.includes(skill)) missingSkills.push(skill); });
        }
    }

    // Display keywords if any match deficits are discovered
    if (isTrackedProfession && missingSkills.length > 0) {
        keywordArea.style.display = "block";
        missingSkills.forEach(skill => {
            keywordList.innerHTML += `<span class="keyword-tag">${skill.toUpperCase()}</span>`;
        });
    }
}

function clearSystemBuffer() {
    document.getElementById("jobTitleInput").value = "";
    document.getElementById("resumeContent").value = "";
    document.getElementById("consoleResult").style.display = "none";
    document.getElementById("proTrigger").style.display = "none";

}

function navigateToProOptimizer() {
    window.location.href = "pro-optimizer.html";
}
</script>

</body>
</html>
